name: Daily Poople Auto Trigger

on:
  schedule:
    # Runs automatically every day at 08:02 UTC (16:02 Beijing Time)
    # Right after the official Poople drops the new puzzle at 08:00 UTC
    - cron: '2 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  trigger-cloudflare-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Daily Rebuild for Cloudflare Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .daily-trigger
          git add .daily-trigger
          git commit -m "chore(daily): auto-trigger poople daily build [$(date -u +'%Y-%m-%d')]" || exit 0
          git push origin main
